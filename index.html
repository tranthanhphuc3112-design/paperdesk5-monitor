<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kiri" />
  <title>Kiri Terminal</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
    :root {
      --bg: #05070b;
      --panel: #0b1018;
      --line: #1a2330;
      --text: #e8f0e9;
      --muted: #7d8b8a;
      --green: #00d35a;
      --green-dim: #0a3d24;
      --amber: #ffc14a;
      --red: #ff5b6b;
      --glow: rgba(0, 211, 90, .45);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100%;
    }
    body {
      overflow-x: hidden;
      background:
        radial-gradient(1200px 500px at 50% -80px, rgba(0,211,90,.08), transparent 60%),
        var(--bg);
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand { font-weight: 700; letter-spacing: .02em; font-size: 15px; }
    .sub {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--muted);
      text-align: right;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0,211,90,.35);
      color: var(--green);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .hero { text-align: center; padding: 8px 0 20px; }
    .balance {
      font-size: clamp(48px, 16vw, 68px);
      font-weight: 720;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 32px rgba(0,211,90,.18);
    }
    .meta {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }
    .mult {
      font-size: 22px;
      font-weight: 650;
      color: var(--green);
    }
    .pnl { font-size: 15px; color: var(--muted); }
    .pnl.up { color: var(--green); }
    .pnl.down { color: var(--red); }
    .mult.flat, .pnl.flat { color: var(--muted); }

    .live {
      background: linear-gradient(180deg, #0d1510 0%, #0a0f14 100%);
      border: 1px solid #163225;
      border-radius: 18px;
      padding: 16px 16px 10px;
      box-shadow: 0 0 0 1px rgba(0,211,90,.05), 0 12px 40px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
    }
    .live::before {
      content: "";
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 3px,
        rgba(0,0,0,.07) 3px, rgba(0,0,0,.07) 4px
      );
      pointer-events: none;
      opacity: .45;
    }
    .live-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .live-tag {
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--green);
      display: flex; align-items: center; gap: 7px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--glow);
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot.off { background: #445; box-shadow: none; animation: none; }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .coin-name { font-size: 11px; color: var(--muted); }
    .coin-name a { color: var(--muted); text-decoration: none; }
    .action {
      position: relative; z-index: 1;
      margin: 14px 0 8px;
      min-height: 52px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.3;
      color: #d6ffe4;
    }
    .action.flash {
      animation: flash 1.1s ease;
    }
    @keyframes flash {
      0% { color: #fff; text-shadow: 0 0 18px var(--glow); transform: translateY(-2px); }
      100% { color: #d6ffe4; text-shadow: none; transform: none; }
    }
    .chart { position: relative; z-index: 1; height: 128px; margin: 4px -6px 0; }
    .chart svg { width: 100%; height: 100%; display: block; }
    .chart .empty {
      height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 12px;
    }

    .bots {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 18px 0 8px;
    }
    .bot {
      text-align: center;
      padding: 8px 0 6px;
    }
    .bot .icon {
      width: 42px; height: 42px; margin: 0 auto 6px;
      border-radius: 50%;
      border: 1.5px solid #223;
      background: #0a0e14;
      display: flex; align-items: center; justify-content: center;
      color: #3b4754;
      transition: all .35s ease;
    }
    .bot .icon svg { width: 20px; height: 20px; }
    .bot .label {
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #556;
    }
    .bot.idle .icon { border-color: #1e3a2a; color: #2a6a45; }
    .bot.idle .label { color: #4a6; }
    .bot.live .icon {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
      box-shadow: 0 0 16px var(--glow);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .bot.live .label { color: var(--green); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 8px var(--glow); }
      50% { box-shadow: 0 0 20px var(--glow); }
    }

    .feed { margin-top: 10px; }
    .feed h2 {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin: 0 0 8px;
    }
    .ev {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 9px 0;
      border-top: 1px solid #141b24;
      font-size: 13px; line-height: 1.35;
    }
    .ev:first-of-type { border-top: 0; }
    .ev time {
      flex: 0 0 42px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      padding-top: 2px;
    }
    .ev p { margin: 0; }
    .ev a { color: inherit; text-decoration: none; }
    .ev.buy p { color: var(--green); }
    .ev.sell p { color: var(--amber); }

    #toasts {
      position: fixed; left: 0; right: 0; top: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 0;
      pointer-events: none;
    }
    .toast {
      pointer-events: none;
      background: #0f1a14;
      border: 1px solid rgba(0,211,90,.4);
      color: #d6ffe4;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 18px rgba(0,211,90,.2);
      animation: toastin .35s ease, toastout .4s ease 3.4s forwards;
      max-width: 420px; width: 100%;
    }
    .toast.sell { border-color: rgba(255,193,74,.45); color: #ffe9b8; background: #1a150c; }
    @keyframes toastin { from { transform: translateY(-16px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes toastout { to { transform: translateY(-12px); opacity: 0 } }

    .stale {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div id="toasts"></div>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Kiri Terminal</div>
        <div class="sub" id="venue">fomo</div>
        <div class="badge" id="badge">PAPER · tiền ảo</div>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </header>

    <section class="hero">
      <div class="balance" id="balance">$100.00</div>
      <div class="meta">
        <div class="mult flat" id="mult">1.00x</div>
        <div class="pnl flat" id="pnl">+$0.00</div>
      </div>
    </section>

    <section class="live">
      <div class="live-top">
        <div class="live-tag"><span class="dot" id="livedot"></span> Live screen</div>
        <div class="coin-name" id="coin"></div>
      </div>
      <div class="action" id="action">Đang quét thị trường…</div>
      <div class="chart" id="chart"></div>
    </section>

    <div class="bots" id="bots"></div>

    <section class="feed">
      <h2>Vừa xảy ra</h2>
      <div id="feed"></div>
    </section>
    <div class="stale" id="stale"></div>
  </div>

  <script>
  const ICONS = {
    scanner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    analyst: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>',
    brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6a4 4 0 0 1 6 0 4 4 0 0 1 4 4c0 4-4 6-7 8-3-2-7-4-7-8a4 4 0 0 1 4-4z"/></svg>',
    executor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l5 5L20 7"/></svg>',
    risk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 18H3L12 3z"/><path d="M12 10v5m0 3h.01"/></svg>'
  };

  const $ = (id) => document.getElementById(id);
  let lastActionId = null;
  let seenToasts = new Set();
  let boot = true;
  let refreshSec = 15;

  function money(n) {
    const v = Number(n);
    if (!Number.isFinite(v)) return "$0.00";
    const sign = v < 0 ? "-" : "";
    return sign + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function clockTick() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Saigon", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }).format(now);
    $("clock").textContent = parts;
  }
  function hhmm(ts) {
    if (!ts) return "";
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Saigon", hour: "2-digit", minute: "2-digit", hour12: false
    }).format(new Date(ts * 1000));
  }

  function renderChart(chart) {
    const el = $("chart");
    const pts = (chart && chart.points) || [];
    if (pts.length < 2) {
      el.innerHTML = '<div class="empty">Đang theo dõi giá…</div>';
      return;
    }
    const w = 400, h = 128, pad = 8;
    const xs = pts.map(p => p.t), ys = pts.map(p => p.p);
    const minX = Math.min(...xs), maxX = Math.max(...xs) || minX + 1;
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const spanY = (maxY - minY) || Math.abs(maxY) * 0.02 || 1;
    const y0 = minY - spanY * 0.15, y1 = maxY + spanY * 0.15;
    const X = t => pad + ((t - minX) / (maxX - minX || 1)) * (w - pad * 2);
    const Y = p => pad + (1 - (p - y0) / (y1 - y0 || 1)) * (h - pad * 2);
    let d = "";
    pts.forEach((p, i) => { d += (i ? " L " : "M ") + X(p.t).toFixed(1) + " " + Y(p.p).toFixed(1); });
    const last = pts[pts.length - 1];
    const up = last.p >= pts[0].p;
    const color = up ? "#00d35a" : "#ff5b6b";
    const area = d + " L " + X(last.t).toFixed(1) + " " + (h - 2) + " L " + X(pts[0].t).toFixed(1) + " " + (h - 2) + " Z";
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${area}" fill="url(#g)"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" from="0,1200" to="1200,0" dur="0.9s" fill="freeze"/>
      </path>
      <circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.p).toFixed(1)}" r="3.5" fill="${color}">
        <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </svg>`;
  }

  function toast(item) {
    if (!item || seenToasts.has(item.id)) return;
    if (item.kind !== "buy" && item.kind !== "sell") return;
    seenToasts.add(item.id);
    if (boot) return;
    const n = document.createElement("div");
    n.className = "toast " + item.kind;
    n.textContent = item.text;
    $("toasts").appendChild(n);
    setTimeout(() => n.remove(), 4000);
  }

  function render(snap) {
    const t = (snap && snap.terminal) || {};
    const desk = (snap && snap.desk) || {};
    const running = !!desk.running;
    $("badge").textContent = t.badge || desk.label || "PAPER · tiền ảo";
    $("venue").textContent = t.venue || "fomo";
    $("balance").textContent = money(t.equity_usd ?? 100);
    const pnl = Number(t.pnl_usd || 0);
    const mult = Number(t.multiplier || 1);
    const mEl = $("mult"), pEl = $("pnl");
    mEl.textContent = (Number.isFinite(mult) ? mult.toFixed(2) : "1.00") + "x";
    pEl.textContent = (pnl >= 0 ? "+" : "") + money(pnl).replace("$", "$");
    // money already has $; keep +$ / -$
    pEl.textContent = (pnl > 0 ? "+" : pnl < 0 ? "-" : "+") + "$" + Math.abs(pnl).toFixed(2);
    const cls = pnl > 0.004 ? "up" : pnl < -0.004 ? "down" : "flat";
    mEl.className = "mult " + cls;
    pEl.className = "pnl " + cls;

    $("livedot").className = "dot" + (running ? "" : " off");
    const live = t.live || {};
    const act = $("action");
    if (live.id && live.id !== lastActionId) {
      act.textContent = live.text || "Đang quét thị trường…";
      act.classList.remove("flash");
      void act.offsetWidth;
      if (!boot && lastActionId) act.classList.add("flash");
      lastActionId = live.id;
    } else if (!act.textContent) {
      act.textContent = live.text || "Đang quét thị trường…";
    }

    const chart = t.chart;
    const coin = $("coin");
    if (chart && chart.symbol) {
      if (chart.fomo) coin.innerHTML = '<a href="' + chart.fomo + '" target="_blank" rel="noopener">' + chart.symbol + "</a>";
      else coin.textContent = chart.symbol;
    } else coin.textContent = "";
    renderChart(chart);

    const bots = t.bots || [];
    $("bots").innerHTML = bots.map(b => {
      const st = b.state || (b.lit ? "live" : "off");
      return `<div class="bot ${st}"><div class="icon">${ICONS[b.id] || ""}</div><div class="label">${b.name}</div></div>`;
    }).join("");

    const feed = t.activity || [];
    $("feed").innerHTML = feed.slice(0, 5).map(ev => {
      const body = ev.fomo
        ? `<a href="${ev.fomo}" target="_blank" rel="noopener">${ev.text}</a>`
        : ev.text;
      return `<div class="ev ${ev.kind}"><time>${hhmm(ev.ts)}</time><p>${body}</p></div>`;
    }).join("") || `<div class="ev"><p>Chưa có hoạt động mới.</p></div>`;

    feed.forEach(toast);
    boot = false;

    refreshSec = Number(snap.refresh_sec) || 15;
    $("stale").textContent = snap.published_at ? "Cập nhật " + snap.published_at : "";
  }

  async function load() {
    try {
      const r = await fetch("./data/snapshot.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      render(await r.json());
    } catch (e) {
      $("stale").textContent = "Đang chờ dữ liệu…";
    }
  }

  clockTick();
  setInterval(clockTick, 1000);
  load();
  setInterval(load, Math.max(8, refreshSec) * 1000);
  </script>
</body>
</html>
