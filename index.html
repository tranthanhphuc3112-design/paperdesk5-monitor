<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PaperDesk5 — Bàn theo dõi</title>
  <meta name="description" content="Trang theo dõi 5 bot của PaperDesk5. Chỉ đọc, tự cập nhật.">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PaperDesk5">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <style>
    :root {
      --bg: #0e1116;
      --bg-2: #161b22;
      --bg-3: #1c232c;
      --line: #2a3340;
      --text: #e8edf2;
      --muted: #8b98a8;
      --dim: #5e6b7a;
      --ok: #3dcc8a;
      --ok-bg: #123528;
      --warn: #e6b84d;
      --warn-bg: #3a2e10;
      --off: #8b98a8;
      --off-bg: #242a32;
      --danger: #f07178;
      --danger-bg: #3a1518;
      --accent: #6cb6ff;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", "Noto Sans", "Segoe UI", system-ui, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 var(--sans);
      -webkit-text-size-adjust: 100%;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.top {
      display: flex; flex-wrap: wrap; gap: 12px 24px;
      align-items: flex-start; justify-content: space-between;
      padding: calc(14px + var(--safe-top)) 16px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-2);
      position: sticky; top: 0; z-index: 5;
    }
    h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 12.5px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
      background: var(--off-bg); color: var(--off);
      border: 1px solid var(--line);
    }
    .pill.ok { background: var(--ok-bg); color: var(--ok); border-color: #1e5a3c; }
    .pill.warn { background: var(--warn-bg); color: var(--warn); border-color: #6a5418; }
    .pill.danger { background: var(--danger-bg); color: var(--danger); border-color: #6a2a30; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .age {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 650;
      border: 1px solid var(--line);
      background: var(--off-bg);
      color: var(--muted);
    }
    .age .clock { font-weight: 500; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .age.fresh { background: var(--ok-bg); color: var(--ok); border-color: #1e5a3c; }
    .age.aging { background: var(--warn-bg); color: var(--warn); border-color: #6a5418; }
    .age.stale { background: var(--danger-bg); color: var(--danger); border-color: #6a2a30; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px 16px;
      margin-top: 8px;
    }
    .metric .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .metric .v { font-variant-numeric: tabular-nums; font-weight: 600; }
    .wrap { padding: 16px 16px calc(28px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 16px; }
    .roles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    @media (max-width: 1100px) {
      .roles { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 620px) {
      .roles { grid-template-columns: 1fr; }
      header.top { padding-left: 14px; padding-right: 14px; }
    }
    .card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 0;
    }
    .role .name { font-weight: 650; font-size: 14px; }
    .role .sub { margin: 2px 0 8px; }
    .role .activity { font-size: 13.5px; margin: 0 0 6px; }
    .role .detail, .role .last { color: var(--muted); font-size: 12px; }
    .role.off { opacity: .92; border-left: 3px solid var(--off); }
    .role.on { border-left: 3px solid var(--ok); }
    .role.dry { border-left: 3px solid var(--warn); }
    .cols {
      display: grid;
      grid-template-columns: 1.1fr 1.2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 1100px) {
      .cols { grid-template-columns: 1fr; }
    }
    section h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .empty {
      color: var(--muted);
      background: var(--bg-3);
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
    }
    .list { display: flex; flex-direction: column; gap: 8px; max-height: 640px; overflow: auto; }
    .row {
      background: var(--bg-3);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .sym { font-weight: 650; }
    .time, .mint { color: var(--dim); font-family: var(--mono); font-size: 11px; }
    .mint { word-break: break-all; }
    .votes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .vchip {
      font-size: 11px; font-weight: 600;
      padding: 1px 6px; border-radius: 999px;
      background: var(--off-bg); color: var(--muted);
    }
    .vchip.BUY { background: var(--ok-bg); color: var(--ok); }
    .vchip.NO { background: var(--danger-bg); color: var(--danger); }
    .score { font-weight: 650; font-variant-numeric: tabular-nums; }
    .score.pass { color: var(--ok); }
    .score.fail { color: var(--muted); }
    .tag {
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
      padding: 1px 6px; border-radius: 4px;
      background: var(--warn-bg); color: var(--warn);
    }
    .tag.sent { background: var(--danger-bg); color: var(--danger); }
    .tag.hist { background: var(--off-bg); color: var(--muted); }
    .pnl-pos { color: var(--ok); }
    .pnl-neg { color: var(--danger); }
    footer.note { color: var(--dim); font-size: 12px; padding: 0 2px; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Bàn theo dõi PaperDesk5</h1>
      <div class="sub" id="clock">Đang tải…</div>
      <div id="age" class="age">Đang kiểm tra tuổi dữ liệu…</div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="pills" id="pills"></div>
  </header>
  <div class="wrap">
    <div class="roles" id="roles"></div>
    <div class="cols">
      <section class="card">
        <h2>Dòng coin vừa quét</h2>
        <div class="list" id="coins"></div>
      </section>
      <section class="card">
        <h2>Bảng phiếu 4/5</h2>
        <div class="list" id="votes"></div>
      </section>
      <section class="card">
        <h2>Lệnh chạy khô &amp; vị thế mở</h2>
        <div id="book"></div>
      </section>
    </div>
    <footer class="note" id="footnote"></footer>
  </div>
  <script>
    const REFRESH_MS = 15000;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
    const money = (n, d=2) => {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Number(n);
      return (v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(d);
    };
    const pct = (n) => {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Number(n);
      const sign = v > 0 ? "+" : (v < 0 ? "" : "");
      return sign + v.toFixed(2) + "%";
    };
    const pnlClass = (n) => (n == null ? "" : (Number(n) >= 0 ? "pnl-pos" : "pnl-neg"));
    const fomoA = (row) => row.fomo
      ? `<a href="${esc(row.fomo)}" target="_blank" rel="noopener noreferrer">${esc(row.symbol || row.mint)}</a>`
      : esc(row.symbol || row.mint || "—");
    const shortMint = (m) => m ? esc(m.slice(0, 6) + "…" + m.slice(-4)) : "";
    const fmtAge = (sec) => {
      if (sec == null || !Number.isFinite(sec)) return "Không rõ tuổi dữ liệu";
      const s = Math.max(0, Math.round(sec));
      if (s < 60) return s + " giây";
      const m = Math.floor(s / 60);
      const r = s % 60;
      if (m < 60) return r ? (m + " phút " + r + " giây") : (m + " phút");
      const h = Math.floor(m / 60);
      const mm = m % 60;
      return mm ? (h + " giờ " + mm + " phút") : (h + " giờ");
    };
    const vnNow = () => new Date().toLocaleString("vi-VN", { timeZone: "Asia/Saigon", hour12: false });

    function dataAgeSec(data) {
      // Prefer published_at (when this file was pushed); fall back to as_of.
      const t = (data && (data.published_at_ts || data.as_of_ts));
      if (t == null || Number.isNaN(Number(t))) return null;
      return (Date.now() / 1000) - Number(t);
    }

    function renderAge(data, err) {
      const age = dataAgeSec(data);
      const desk = (data && data.desk) || {};
      const el = $("age");
      let kind = "stale";
      if (age != null && age < 3 * 60) kind = "fresh";
      else if (age != null && age < 15 * 60) kind = "aging";
      el.className = "age " + kind;
      const asOf = (data && data.as_of) || "—";
      const published = (data && data.published_at) || asOf;
      const tz = (data && data.timezone) || "Asia/Saigon (UTC+7)";
      let headline;
      if (err && !data) headline = "Không tải được dữ liệu";
      else if (kind === "fresh") headline = "Dữ liệu còn mới — cách đây " + fmtAge(age);
      else if (kind === "aging") headline = "Dữ liệu hơi cũ — cách đây " + fmtAge(age);
      else headline = "Dữ liệu đã cũ — cách đây " + fmtAge(age);
      let extra = "Lúc dữ liệu: " + asOf + " · Xuất bản: " + published + " · " + tz;
      if (desk.state === "off" && kind !== "fresh") {
        extra += ". Desk đang tắt nên dữ liệu có thể không đổi; máy xuất bản chỉ đẩy khi có thay đổi.";
      }
      if (err) extra += " Lỗi tải lần này: " + err;
      el.innerHTML = esc(headline) + `<div class="clock">${esc(extra)} · Trang hỏi lại lúc ${esc(vnNow())}</div>`;
    }

    function render(data, err) {
      const asOf = data && data.as_of ? data.as_of : "—";
      const tz = data && data.timezone ? data.timezone : "Asia/Saigon (UTC+7)";
      const desk = (data && data.desk) || {};
      const rules = (data && data.rules) || {};
      const state = desk.state || "off";
      const pillClass = state === "off" ? "danger" : (state === "live" ? "danger" : "warn");
      const pollSec = (data && data.refresh_sec) || 15;
      const pubSec = (data && data.publish_interval_sec) || 60;
      $("clock").textContent = err && !data
        ? ("Không lấy được dữ liệu. " + (err || ""))
        : ("Cập nhật lúc " + asOf + " · " + tz + " · trang hỏi lại mỗi " + pollSec + " giây · máy xuất bản tối đa mỗi " + pubSec + " giây (GitHub Pages có thể chậm thêm)");
      renderAge(data, err);

      $("pills").innerHTML =
        `<span class="pill ${pillClass}"><span class="dot"></span>${esc(desk.label || "DESK ĐANG TẮT")}</span>` +
        `<span class="pill">Phiếu ${esc(rules.min_votes || 4)}/5</span>` +
        `<span class="pill">${esc(money(rules.ticket_usd, 0))} / lệnh · tối đa ${esc(money(rules.max_open_usd, 0))}</span>` +
        `<span class="pill">SL ${esc(rules.stop_loss_pct)}% · TP +${esc(rules.take_profit_pct)}%</span>`;

      const eq = data && data.equity;
      const counts = (data && data.counts) || {};
      const stopped = desk.stopped && desk.stopped.at
        ? `Tắt lúc ${desk.stopped.at}`
        : "";
      $("metrics").innerHTML = [
        ["Sổ ảo", eq ? money(eq.equity_usd) : "—"],
        ["Tiền mặt", eq ? money(eq.cash_usd) : "—"],
        ["Vị thế mở", String((data && data.open_positions && data.open_positions.length) || 0)],
        ["P&L đã chốt", money(counts.realized_pnl_usd)],
        ["Lệnh chạy khô", String(counts.live_attempts || 0)],
      ].map(([k,v]) => `<div class="metric"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("")
      + (stopped ? `<div class="metric"><div class="k">Lần tắt gần nhất</div><div class="v">${esc(stopped)}</div></div>` : "");

      const roles = (data && data.roles) || [];
      $("roles").innerHTML = roles.map(r => {
        const st = r.state === "on" ? "on" : "off";
        const last = r.last_at
          ? `Lần hoạt động gần nhất: ${esc(r.last_at)}` + (r.last_note ? ` · ${esc(r.last_note)}` : "")
          : "Chưa có nhịp hoạt động";
        return `<article class="card role ${st}">
          <div class="name">${esc(r.name)}</div>
          <div class="sub">${esc(r.subtitle)}</div>
          <div class="activity">${esc(r.activity)}</div>
          ${r.detail ? `<div class="detail">${esc(r.detail)}</div>` : ""}
          <div class="last">${last}</div>
        </article>`;
      }).join("");

      const coins = (data && data.coins) || [];
      if (!coins.length) {
        $("coins").innerHTML = `<div class="empty">${state === "off"
          ? "Chưa có dòng coin để xem — desk đang tắt, chưa có phiên mới."
          : "Chưa quét được coin nào trong phiên này."}</div>`;
      } else {
        const caption = state === "off"
          ? `<div class="empty" style="margin-bottom:8px">Desk đang tắt. Đây là các coin quét lần cuối (không phải dòng sống).</div>`
          : "";
        $("coins").innerHTML = caption + coins.map(c => {
          const tag = c.flow === "watching"
            ? `<span class="tag">ĐANG THEO</span>`
            : (state === "off" ? `<span class="tag hist">LẦN CUỐI</span>` : `<span class="tag hist">${esc(c.status || "")}</span>`);
          return `<div class="row">
            <div class="top"><span class="sym">${fomoA(c)} ${tag}</span><span class="time">${esc(c.seen_at || "")}</span></div>
            <div class="sub">${esc(c.name || "")} · ${esc(c.platform || "")}${c.samples != null ? " · " + c.samples + " mẫu" : ""}</div>
            <div class="mint">${c.fomo ? `<a href="${esc(c.fomo)}" target="_blank" rel="noopener noreferrer">${shortMint(c.mint)}</a>` : shortMint(c.mint)}</div>
          </div>`;
        }).join("");
      }

      const votes = (data && data.votes) || [];
      if (!votes.length) {
        $("votes").innerHTML = `<div class="empty">${state === "off"
          ? "Chưa có bảng phiếu của phiên mới — desk đang tắt. Các phiếu cũ (nếu có) sẽ hiện khi có dữ liệu."
          : "Chưa có coin nào được 5 nhà đầu tư bỏ phiếu."}</div>`;
      } else {
        const cap = state === "off"
          ? `<div class="empty" style="margin-bottom:8px">Desk đang tắt. Bảng dưới là phiếu của lần chạy trước.</div>`
          : "";
        $("votes").innerHTML = cap + votes.map(b => {
          const cls = b.passed ? "pass" : "fail";
          const action = b.action ? ` · ${esc(b.action)}` : "";
          const chips = (b.votes || []).map(v =>
            `<span class="vchip ${esc(v.vote)}" title="${esc(v.reason || "")}">${esc(v.label)} ${esc(v.vote)}</span>`
          ).join("");
          return `<div class="row">
            <div class="top">
              <span class="sym">${fomoA(b)} <span class="score ${cls}">${b.yes}/${b.of}</span></span>
              <span class="time">${esc(b.at || "")}</span>
            </div>
            <div class="sub">${esc(b.name || "")}${action}${b.reason ? " · " + esc(b.reason) : ""}</div>
            <div class="votes">${chips}</div>
          </div>`;
        }).join("");
      }

      const open = (data && data.open_positions) || [];
      const dry = (data && data.dry_orders) || [];
      const closed = (data && data.recent_closed) || [];
      let book = `<h3 style="margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em">VỊ THẾ ĐANG MỞ</h3>`;
      if (!open.length) {
        book += `<div class="empty">${state === "off" ? "Không có vị thế đang mở — desk đang tắt." : "Không có vị thế đang mở."}</div>`;
      } else {
        book += `<div class="list">` + open.map(p => `<div class="row">
          <div class="top"><span class="sym">${fomoA(p)}</span>
            <span class="${pnlClass(p.last_mkt_pct)}">${esc(pct(p.last_mkt_pct))} TT</span>
          </div>
          <div class="sub">Vào ${esc(p.opened_at || "")} · ${esc(money(p.cost_usd))}
            · paper ${esc(pct(p.last_mark_pnl_pct))}</div>
        </div>`).join("") + `</div>`;
      }
      book += `<h3 style="margin:14px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em">LỆNH CHẠY KHÔ</h3>`;
      if (!dry.length) {
        book += `<div class="empty">Chưa có lệnh chạy khô. Khi desk bật, mỗi lệnh giả lập sẽ hiện ở đây với nhãn CHẠY KHÔ.</div>`;
      } else {
        book += `<div class="list">` + dry.map(o => {
          const tag = o.sent ? `<span class="tag sent">LỆNH THẬT</span>` : `<span class="tag">CHẠY KHÔ</span>`;
          const gate = o.gate_reason ? esc(o.gate_reason) : "";
          const sim = o.sim_ok == null ? "" : (o.sim_ok ? "sim OK" : "sim lỗi");
          return `<div class="row">
            <div class="top"><span class="sym">${esc(o.side || "")} ${fomoA(o)} ${tag}</span>
              <span class="time">${esc(o.at || "")}</span></div>
            <div class="sub">${[o.amount_usd != null ? money(o.amount_usd) : null, sim, gate].filter(Boolean).join(" · ")}</div>
          </div>`;
        }).join("") + `</div>`;
      }
      if (closed.length) {
        book += `<h3 style="margin:14px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em">VỊ THẾ PAPER ĐÃ ĐÓNG (LẦN TRƯỚC)</h3>`;
        book += `<div class="list">` + closed.map(p => `<div class="row">
          <div class="top"><span class="sym">${fomoA(p)}</span>
            <span class="${pnlClass(p.pnl_pct)}">${esc(pct(p.pnl_pct))}</span></div>
          <div class="sub">${esc(p.exit_reason_vi || p.exit_reason || "")} · TT ${esc(pct(p.exit_mkt_pct))} · ${esc(p.closed_at || "")}</div>
        </div>`).join("") + `</div>`;
      }
      $("book").innerHTML = book;

      $("footnote").textContent = "Trang công khai chỉ đọc. Không đặt lệnh, không hiện khóa ví hay token. Liên kết FOMO chỉ dùng địa chỉ công khai của coin. Máy xuất bản đẩy lên GitHub khi dữ liệu thay đổi, tối đa mỗi 60 giây; trang hỏi lại mỗi 15 giây. GitHub Pages có thể cache nên dữ liệu đôi khi chậm hơn. Thời gian theo Asia/Saigon (UTC+7).";
    }

    let last = null;
    async function tick() {
      try {
        const r = await fetch("data/snapshot.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        last = await r.json();
        render(last, null);
      } catch (e) {
        if (last) render(last, String(e.message || e));
        else {
          $("clock").textContent = "Không tải được dữ liệu: " + (e.message || e);
          renderAge(null, String(e.message || e));
        }
      }
    }
    tick();
    setInterval(tick, REFRESH_MS);
  </script>
</body>
</html>
